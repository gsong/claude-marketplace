[tools]
node = "24.21.0" # prettier installs through npm
prettier = "3.9.9"
ruff = "0.16.9"
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tasks.lint]
description = "Run every lint check that CI runs; CI also runs scan:skills and scan:hooks"
depends = ["lint:*"]

[tasks."lint:cowork-marks"]
description = "Check the evidence marks and relative links in the cowork:build skill"
run = "scripts/lint-cowork-marks.py"

[tasks."lint:plugins"]
description = "Validate the marketplace and each plugin"
run = """
claude plugin validate --strict .
for plugin in plugins/*/; do claude plugin validate --strict "$plugin"; done
"""

[tasks."lint:prettier"]
description = "Check formatting of JSON, Markdown, YAML and .mjs files"
run = "git ls-files -z '*.json' '*.md' '*.yml' '*.yaml' '*.mjs' | xargs -0 prettier --check"

[tasks."lint:ruff"]
description = "Lint the Python scripts"
run = "git ls-files -z '*.py' | xargs -0 ruff check"

[tasks."lint:shellcheck"]
description = "Lint the shell scripts"
# The browser and cloudflare scripts have no extension: they run by name.
run = "git ls-files -z '*.sh' 'plugins/browser/skills/chrome/scripts/*' 'plugins/cloudflare/skills/*/scripts/*' | xargs -0 shellcheck"

[tasks."lint:zizmor"]
description = "Audit the GitHub Actions workflows"
run = "zizmor .github/workflows"

[tasks."scan:skills"]
description = "Scan the skills for security risks; pass a path to also write SARIF"
# The tool is declared here, so only this task installs it. uv installs the
# published wheel. Building from the sdist needs a Go toolchain. The wheels
# cover Python 3.11 to 3.14 only, so pin 3.14 for machines that default to 3.15.
tools = { "pipx:cisco-ai-skill-scanner" = { version = "2.2.0", uvx_args = "--no-build --python 3.14" } }
run = "scripts/scan-skills.sh"

[tasks."scan:hooks"]
description = "Scan the plugin hooks for network use and code fetches"
run = "scripts/scan-hooks.py"

[tasks.test]
description = "Run the browser and cloudflare plugin tests"
# A bare directory is read as one test file, so pass a glob. node expands it.
run = "node --test 'plugins/browser/tests/*.test.mjs' 'plugins/cloudflare/tests/*.test.mjs'"

[tasks."docs:mirror"]
description = "Mirror the public Claude doc sets into .cache/docs-mirror so doc claims can be rechecked with grep; pass --force to refetch, --host to limit"
run = "scripts/docs-mirror.py"
