[tools]
node = "24.21.0" # prettier installs through npm
prettier = "3.9.9"
ruff = "0.16.9"
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tasks.lint]
description = "Run every check that CI runs"
depends = ["lint:*"]

[tasks."lint:plugins"]
description = "Validate the marketplace and each plugin"
run = """
claude plugin validate --strict .
for plugin in plugins/*/; do claude plugin validate --strict "$plugin"; done
"""

[tasks."lint:prettier"]
description = "Check formatting of JSON, Markdown, YAML and .mjs files"
run = "git ls-files -z '*.json' '*.md' '*.yml' '*.yaml' '*.mjs' | xargs -0 prettier --check"

[tasks."lint:ruff"]
description = "Lint the Python scripts"
run = "git ls-files -z '*.py' | xargs -0 ruff check"

[tasks."lint:shellcheck"]
description = "Lint the shell scripts"
run = "git ls-files -z '*.sh' | xargs -0 shellcheck"

[tasks."lint:zizmor"]
description = "Audit the GitHub Actions workflows"
run = "zizmor .github/workflows"

[tasks."scan:skills"]
description = "Scan the plugins for security risks; pass a path to also write SARIF"
# The tool is declared here, so only this task installs it. uv installs the
# published wheel. Building from the sdist needs a Go toolchain.
tools = { "pipx:cisco-ai-skill-scanner" = { version = "2.2.0", uvx_args = "--no-build" } }
run = '''
#!/usr/bin/env bash
set -euo pipefail

report=()
if [[ $# -gt 0 ]]; then
  out=$1
  if [[ $out != /* ]]; then out=${MISE_ORIGINAL_CWD:-$PWD}/$out; fi
  report=(--format sarif --output-sarif "$out")
fi
policy=$PWD/skill-scanner-policy.yaml

# Scan a copy that holds only the files git tracks or does not ignore. The
# scanner reads ignored files such as __pycache__, which a CI checkout does
# not have, and reports their bytecode as critical.
copy=$(mktemp -d)
trap 'rm -rf "$copy"' EXIT
git ls-files -z --cached --others --exclude-standard plugins |
  while IFS= read -r -d '' f; do if [[ -e $f ]]; then printf '%s\0' "$f"; fi; done |
  tar --null -T - -cf - | tar -xf - -C "$copy"

# SARIF paths are relative to the working directory, so scan from the copy's root.
cd "$copy"
skill-scanner scan-all plugins --recursive --policy "$policy" \
  --fail-on-severity high --format summary ${report[@]+"${report[@]}"}
'''
