schema_version: "1.1"
name: inbox-triage
description: "Inbox triage prose: a fit pending the judge, with no pass bar"
runs: 3
context:
  scaffold_script: scaffold.sh
  # The run denies reads outside its working directory. skill links to the
  # skill directory, so the run can read the skill's reference files.
  add_dirs: [skill]
execution:
  model: sonnet
  max_turns: 14
  timeout_seconds: 80
  allowed_tools: [Write, Edit]
  prompt: |
    /clef:find-opportunities

    Call this input "inbox-triage". Here is how our inbox triage works:

    > Every night at 2 a.m., a batch job reads the day's mail in the shared sales inbox, about 1,200 emails. For each email it sends the subject and body to GPT-4o and asks whether the email is a sales lead, a support request, a vendor invoice, or spam. It parses the one-word reply and moves the email into the matching folder. Anything the model can't place stays in the inbox.
    >
    > Each morning, sales reps work the Leads folder, support takes the Support folder, and finance pays from the Invoices folder. When an email lands in the wrong folder, whoever finds it drags it to the right one. Spam is deleted after 30 days.

    You can't ask me questions in this session, so here are my answers up front:

    - A wrong folder costs little: someone drags the email back, and spam waits 30 days before deletion.
    - If Clef has no answer, the job falls back to today's GPT-4o call.
    - The job runs on a Mac Studio with 64 GB of memory, so Clef can run there. It's a nightly batch, so there's no latency budget.
    - Compare against Claude Opus.
graders:
  - type: file_exists
    name: record-exists
    path: "clef-opportunities/inbox-triage-????-??-??.md"
  - type: regex
    name: record-at-todays-path
    target: { source: file, path: .eval-record.md }
    pattern: "^# Clef opportunities: "
    flags: m
  - type: regex
    name: sections-in-order
    target: { source: file, path: .eval-record.md }
    pattern: '^# Clef opportunities: [\s\S]*^## Review$[\s\S]*^## Survey$[\s\S]*^## Decision points$[\s\S]*^## Experiment template$'
    flags: m
  - type: regex
    name: every-decision-point-has-a-verdict
    target: { source: file, path: .eval-record.md }
    pattern: '^### \d+\. [^\n]*\n+(?!\n)(?!\*\*Verdict: (?:fits, local|fits, cloud|fits, pending |no fit: |skipped by user))'
    flags: m
    match: not_contains
  - type: regex
    name: none-not-reached
    target: { source: file, path: .eval-record.md }
    pattern: 'not reached\*\*|Review not run yet'
    match: not_contains
  - type: regex
    name: review-row-for-every-entry
    target: { source: file, path: .eval-record.md }
    pattern: '^### (\d+)\. (?<![\s\S]*^\| \1 +\|[\s\S]*)'
    flags: m
    match: not_contains
  - type: regex
    name: no-review-row-without-entry
    target: { source: file, path: .eval-record.md }
    pattern: '^\| (\d+) +\|(?![\s\S]*^### \1\. )'
    flags: m
    match: not_contains
  # allowed_tools leaves Bash out of the session, so the model cannot call
  # ollama and this grader cannot fail. It checks the no-run rule only in a
  # run started with --allow-tools Bash.
  - type: tool_used
    name: never-runs-ollama
    tool: Bash
    input_match: "ollama"
    min: 0
    max: 0
  - type: regex
    name: fits-pending-the-judge
    target: { source: file, path: .eval-record.md }
    pattern: '\*\*Verdict: fits, pending the judge\b'
  - type: regex
    name: pass-bar-unset
    target: { source: file, path: .eval-record.md }
    pattern: '\*\*Pass bar:\*\* *"?[Tt]o set before the offline run'
  - type: regex
    name: open-items-hold-judge
    target: { source: file, path: .eval-record.md }
    pattern: '^### Open items\n(?:(?!^## )[\s\S])*?judge'
    flags: mi
  - type: regex
    name: open-items-hold-pass-bar
    target: { source: file, path: .eval-record.md }
    pattern: '^### Open items\n(?:(?!^## )[\s\S])*?pass bar'
    flags: mi
  - type: llm
    name: survey-finds-decision-points
    focus: { source: file, path: .eval-record.md }
    criteria: |
      Read the record's Decision points section. Each decision point there starts with a heading of the form "### <number>. <name>". Pass if one decision point is about sorting emails in the shared sales inbox into folders or categories. Ignore every other decision point, and ignore the verdicts.
