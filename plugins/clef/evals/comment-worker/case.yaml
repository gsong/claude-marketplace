schema_version: "1.1"
name: comment-worker
description: "Cloudflare Worker file: a cloud fit with the four cloud fields"
runs: 3
context:
  scaffold_script: scaffold.sh
  # The run denies reads outside its working directory. skill links to the
  # skill directory, so the run can read the skill's reference files.
  add_dirs: [skill]
execution:
  model: sonnet
  max_turns: 11
  timeout_seconds: 90
  allowed_tools: [Write, Edit]
  prompt: |
    /clef:find-opportunities moderate-comments.js

    That's the Cloudflare Worker that moderates comments on our blog. You can't ask me questions in this session, so here are my answers up front:

    - Local Clef can't run there. It's a Worker, with no GPU and no machine of ours behind it. Sam Ortiz, who owns the blog, said on 2026-10-01 that comment text may leave our machines, because comments are public anyway.
    - A wrong label costs little. Hidden comments stay in the database, and a person works the review queue and can restore any comment.
    - If Clef has no answer, the Worker keeps today's Llama call.
    - The labels: our moderators' past decisions on the review queue, about 5,000 comments. Sam Ortiz rechecks disputes.
    - Readers never wait on moderation. The blog shows a comment only after the Worker answers, so treat it as background work with no latency budget.
    - About 5,000 comments a day, about 150 tokens each.
    - Compare against Claude Opus. Pass bar: Clef ties or beats the Llama call on the comments it answers, and answers at least 70% of them.
graders:
  - type: file_exists
    name: record-exists
    path: "clef-opportunities/moderate-comments-????-??-??.md"
  - type: regex
    name: record-at-todays-path
    target: { source: file, path: .eval-record.md }
    pattern: "^# Clef opportunities: "
    flags: m
  - type: regex
    name: sections-in-order
    target: { source: file, path: .eval-record.md }
    pattern: '^# Clef opportunities: [\s\S]*^## Review$[\s\S]*^## Survey$[\s\S]*^## Decision points$[\s\S]*^## Experiment template$'
    flags: m
  - type: regex
    name: every-decision-point-has-a-verdict
    target: { source: file, path: .eval-record.md }
    pattern: '^### \d+\. [^\n]*\n+(?!\n)(?!\*\*Verdict: (?:fits, local|fits, cloud|fits, pending |no fit: |skipped by user))'
    flags: m
    match: not_contains
  - type: regex
    name: none-not-reached
    target: { source: file, path: .eval-record.md }
    pattern: 'not reached\*\*|Review not run yet'
    match: not_contains
  - type: regex
    name: review-row-for-every-entry
    target: { source: file, path: .eval-record.md }
    pattern: '^### (\d+)\. (?<![\s\S]*^\| \1 +\|[\s\S]*)'
    flags: m
    match: not_contains
  - type: regex
    name: no-review-row-without-entry
    target: { source: file, path: .eval-record.md }
    pattern: '^\| (\d+) +\|(?![\s\S]*^### \1\. )'
    flags: m
    match: not_contains
  - type: tool_used
    name: never-runs-ollama
    tool: Bash
    input_match: "ollama"
    min: 0
    max: 0
  - type: regex
    name: fits-cloud
    target: { source: file, path: .eval-record.md }
    pattern: '\*\*Verdict: fits, cloud\*\*'
  - type: regex
    name: cloud-why-not-local
    target: { source: file, path: .eval-record.md }
    pattern: '\*\*Why not local:\*\* *\S'
  - type: regex
    name: cloud-data-may-leave
    target: { source: file, path: .eval-record.md }
    pattern: '\*\*Data may leave the machine:\*\* *[^\n]*Sam Ortiz'
  - type: regex
    name: cloud-cost-estimate
    target: { source: file, path: .eval-record.md }
    pattern: '\*\*Cost estimate\b[^\n]*\d'
  - type: regex
    name: cloud-open-checks
    target: { source: file, path: .eval-record.md }
    pattern: '\*\*Open checks in the Cloudflare dashboard:\*\* *[^\n]*rate limits'
    flags: i
  - type: llm
    name: survey-finds-decision-points
    focus: { source: file, path: .eval-record.md }
    criteria: |
      The record's survey found this decision point, under any name: moderating each blog comment (publish, hide or send to review), from the Workers AI call in moderate-comments.js.
      Pass if it appears as a decision point. Other decision points may also appear.
