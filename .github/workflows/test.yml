name: "Tests"

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  gh-tools-validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "plugins/gh-tools/scripts/*.py"

      - run: uv run --script plugins/gh-tools/scripts/test_validate_findings.py

  writing-hooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      # html-prose.pl needs HTML::Parser. macOS perl ships it and Ubuntu perl does not.
      - run: sudo apt-get install -y --no-install-recommends libhtml-parser-perl

      # A bare directory is read as one test file, so pass a glob. node expands it.
      - run: node --test 'plugins/writing/tests/*.test.mjs'
